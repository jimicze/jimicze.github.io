[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ats-cv"
version = "0.1.0"
description = "AI-assisted ATS CV optimizer for Ondřej Lasák"
requires-python = ">=3.11"
dependencies = [
    # PDF extraction
    "pdfplumber>=0.11",
    "pypdf>=4.0",
    # DOCX extraction & generation
    "python-docx>=1.1",
    "docxtpl>=0.18",
    # Web framework
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # HTML templating
    "jinja2>=3.1",
    # ATS scoring
    "spacy>=3.7",
    "keybert>=0.8",
    "sentence-transformers>=3.0",
    # PDF generation (ATS-safe variant)
    "weasyprint>=62.0",
    # Data validation
    "pydantic>=2.7",
    # Utilities
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
